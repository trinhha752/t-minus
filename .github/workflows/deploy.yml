# Deploys the game to https://tminus.boston every time someone pushes to main.
#
# The Vercel project can't be connected to this repo directly (it lives on a teammate's Vercel
# account), so this does what `vercel deploy --prod` does from a laptop: upload the code and let
# Vercel build it there, with the env vars already saved in the Vercel project.
#
# Needs one repo secret (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN   a token from https://vercel.com/account/settings/tokens, scoped to the tminus team
# (VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets, if set, are no longer used.)
# You can also run it by hand: Actions → "Deploy to Vercel" → Run workflow.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# If two pushes land close together, only the newest one deploys.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Which Vercel team and project to deploy to. These are ids, not passwords, so they live here
      # rather than in secrets (where a stray space when pasting broke the lookup).
      VERCEL_ORG_ID: team_aHkOeQyO2g35DFNjon8SWG19
      VERCEL_PROJECT_ID: prj_kcYWo9iXopmuZ9AII4cByJKQluPj
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Fails fast with a clear message if the token is missing or can't see the tminus team
      - name: Check the Vercel token
        run: npx --yes vercel@66.6.0 whoami --token="${{ secrets.VERCEL_TOKEN }}"

      # Plain `vercel --prod` (not `vercel deploy`): the repo has a deploy/ folder the CLI confuses with the command
      - name: Deploy to production
        run: npx --yes vercel@66.6.0 --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
